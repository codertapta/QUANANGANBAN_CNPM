services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodguide
    volumes: [dbdata:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 30
  restaurant-service:
    build: ./restaurant-service
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: foodguide
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-food-guide-local-dev}
    depends_on: { mysql: { condition: service_healthy } }
  translation-service:
    build: ./translation-service
    environment:
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-food-guide-local-dev}
      CACHE_DB_HOST: mysql
      CACHE_DB_PORT: 3306
      CACHE_DB_USER: root
      CACHE_DB_PASSWORD: root
      CACHE_DB_NAME: foodguide
      CACHE_DB_SSL: "false"
    depends_on: { mysql: { condition: service_healthy } }
  gateway:
    build: ./gateway
    ports: ["8080:8080"]
    volumes:
      - ./gateway/public:/app/public
    environment:
      RESTAURANT_URL: http://restaurant-service:3001
      TRANSLATE_URL: http://translation-service:3002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-food-guide-local-dev}
    depends_on: [restaurant-service, translation-service]
  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 --url http://gateway:8080
    depends_on: [gateway]
    profiles: ["tunnel"]
volumes:
  dbdata:
