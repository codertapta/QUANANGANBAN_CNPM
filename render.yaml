services:
  - type: web
    name: food-guide-gateway
    runtime: docker
    plan: free
    region: singapore
    rootDir: gateway
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: RESTAURANT_URL
        fromService:
          name: food-guide-restaurant
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRANSLATE_URL
        fromService:
          name: food-guide-translation
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: food-guide-restaurant
    runtime: docker
    plan: free
    region: singapore
    rootDir: restaurant-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: foodguide
      - key: DB_SSL
        value: "true"
      - key: INTERNAL_API_KEY
        fromService:
          name: food-guide-gateway
          type: web
          envVarKey: INTERNAL_API_KEY

  - type: web
    name: food-guide-translation
    runtime: docker
    plan: free
    region: singapore
    rootDir: translation-service
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: INTERNAL_API_KEY
        fromService:
          name: food-guide-gateway
          type: web
          envVarKey: INTERNAL_API_KEY
      - key: CACHE_DB_HOST
        fromService:
          name: food-guide-restaurant
          type: web
          envVarKey: DB_HOST
      - key: CACHE_DB_PORT
        value: "4000"
      - key: CACHE_DB_USER
        fromService:
          name: food-guide-restaurant
          type: web
          envVarKey: DB_USER
      - key: CACHE_DB_PASSWORD
        fromService:
          name: food-guide-restaurant
          type: web
          envVarKey: DB_PASSWORD
      - key: CACHE_DB_NAME
        fromService:
          name: food-guide-restaurant
          type: web
          envVarKey: DB_NAME
      - key: CACHE_DB_SSL
        value: "true"
      - key: AZURE_TRANSLATOR_KEY
        sync: false
      - key: AZURE_TRANSLATOR_REGION
        sync: false
